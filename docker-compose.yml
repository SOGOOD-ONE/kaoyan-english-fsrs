services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/kaoyan.db}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}  # Set to your production domain
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE_NONE: ${COOKIE_SAMESITE_NONE:-false}
      PORT: 5000
    # Resource limits to prevent resource exhaustion
    mem_limit: 512m
    cpus: "0.5"
    restart: unless-stopped
    volumes:
      - backend_data:/data
    # Publish on localhost so the host nginx reverse proxy can reach it.
    ports:
      - "127.0.0.1:5000:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  backend_data:
