services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/kaoyan.db}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE_NONE: ${COOKIE_SAMESITE_NONE:-false}
      PORT: 5000
    volumes:
      - backend_data:/data
    ports:
      - "5000:5000"

volumes:
  backend_data:
