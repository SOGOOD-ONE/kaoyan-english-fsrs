services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kaoyan
      POSTGRES_USER: kaoyan
      POSTGRES_PASSWORD: kaoyan_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://kaoyan:kaoyan_dev@db:5432/kaoyan
      SECRET_KEY: change-me
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      - db
volumes:
  pgdata:
